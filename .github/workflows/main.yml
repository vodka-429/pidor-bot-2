name: Build and deploy to vdsina1
on:
  push:
    branches: [main, infra/vdsina1]
    paths-ignore: ["deploy/charts/app/values-vdsina1.yaml"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: bot-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/vodka-429/pidor-bot-2:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish the image version to GitOps
        env:
          IMAGE_VERSION: sha-${{ github.sha }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin "$GITHUB_REF_NAME"
          sed -i "s/^  version: .*/  version: $IMAGE_VERSION/" deploy/charts/app/values-vdsina1.yaml
          git add deploy/charts/app/values-vdsina1.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: deploy image $IMAGE_VERSION [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
