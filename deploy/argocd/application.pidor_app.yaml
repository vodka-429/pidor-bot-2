apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pidor-2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vodka-429/pidor-bot-2.git
    targetRevision: main
    path: deploy/charts/app
    helm:
      valueFiles:
      - values.yaml
      - values-vdsina1.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: pidor
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
    - CreateNamespace=true
